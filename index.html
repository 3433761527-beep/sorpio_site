<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06152b"><title>给你的星空 · 19岁生日</title><style>
:root{--bg:#06152b;--blue:#0b2c50;--ice:#d9efff;--gold:#ffe5a0;--line:#8fc8f477}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#123d68 0,#071b35 45%,#030a17 100%);color:#eaf6ff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 10% 20%,#fff 99%,transparent),radial-gradient(2px 2px at 70% 30%,#c9eaff 99%,transparent),radial-gradient(1px 1px at 40% 80%,#fff 99%,transparent),radial-gradient(1px 1px at 90% 70%,#fff 99%,transparent),radial-gradient(2px 2px at 25% 55%,#fff 99%,transparent);background-size:180px 180px,240px 240px,130px 130px,200px 200px,300px 300px;opacity:.75;animation:twinkle 5s infinite alternate}@keyframes twinkle{to{opacity:.35}}.wrap{max-width:1000px;margin:auto;padding:30px 18px 70px;position:relative}.top{text-align:center;padding:34px 0 22px}.eyebrow{letter-spacing:.35em;color:#a9d8ff;font-size:11px}.top h1{font-family:Georgia,serif;font-size:clamp(32px,7vw,62px);font-weight:400;letter-spacing:.12em;margin:18px 0 8px;text-shadow:0 0 25px #7ecaff}.top p{color:#b7d4eb;letter-spacing:.12em;font-size:14px}.moon{position:absolute;right:9%;top:35px;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#c8e2f7 58%,#789bbd);box-shadow:0 0 45px #a8d9ff88}.orbit{border:1px solid #8bcaff55;border-radius:50%;width:min(88vw,720px);height:min(88vw,720px);max-height:650px;max-width:650px;margin:18px auto 0;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#12375a55 0,transparent 65%)}.orbit:before,.orbit:after{content:"";position:absolute;border:1px dashed #8fc8f433;border-radius:50%;inset:10%;transform:rotate(-22deg)}.orbit:after{inset:22%;transform:rotate(38deg)}.center{width:34%;text-align:center;z-index:1}.center img{width:100%;max-width:150px;image-rendering:pixelated;filter:drop-shadow(0 0 18px #80cfff88)}.center b{display:block;font-family:Georgia,serif;font-size:clamp(16px,3vw,24px);font-weight:400;letter-spacing:.15em}.stars{position:absolute;inset:0}.star{position:absolute;width:82px;height:82px;border:1px solid #a6d9ff77;border-radius:50%;background:linear-gradient(145deg,#143d63dd,#06182ddd);color:#eaf7ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 0 22px #4c9bd833,inset 0 0 18px #80caff19;cursor:pointer;transition:.25s;transform:translate(-50%,-50%)}.star:active{transform:translate(-50%,-50%) scale(.92)}.star:hover{box-shadow:0 0 30px #9bdcffaa; border-color:#e4f6ff}.star .ico{font-size:24px;color:#ffe6a6;text-shadow:0 0 14px #ffe6a6}.star small{font-size:10px;letter-spacing:.08em}.star:nth-child(1){left:50%;top:4%}.star:nth-child(2){left:79%;top:13%}.star:nth-child(3){left:94%;top:39%}.star:nth-child(4){left:83%;top:75%}.star:nth-child(5){left:60%;top:94%}.star:nth-child(6){left:30%;top:94%}.star:nth-child(7){left:10%;top:72%}.star:nth-child(8){left:5%;top:42%}.star:nth-child(9){left:20%;top:15%}.star:nth-child(10){left:37%;top:3%}.star:nth-child(11){left:50%;top:50%;background:linear-gradient(145deg,#254f71,#0b2440);border-color:#ffe3a0}.footer{text-align:center;color:#8eacc7;font-size:12px;margin-top:24px;letter-spacing:.12em}.btn{border:1px solid #9ccff088;color:#eaf7ff;background:#0b2b4dcc;border-radius:999px;padding:11px 18px;cursor:pointer}.panel{position:fixed;inset:0;background:#020916d9;backdrop-filter:blur(12px);z-index:5;display:none;align-items:center;justify-content:center;padding:16px}.panel.show{display:flex}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:linear-gradient(160deg,#123657,#07182d 65%,#050e1d);border:1px solid #9bcff077;border-radius:24px;padding:24px;box-shadow:0 0 55px #3c8dca44;position:relative}.close{position:absolute;right:15px;top:13px;border:0;background:transparent;color:#d8edff;font-size:25px}.dialog h2{font-weight:400;letter-spacing:.12em;margin:4px 35px 8px 0}.sub{color:#a9c9e4;font-size:13px;margin-bottom:20px}.content{line-height:1.8}.field,textarea,select{width:100%;background:#041326;color:#eaf6ff;border:1px solid #8fc8f466;border-radius:10px;padding:11px;margin:6px 0;font:inherit}.content button{margin:6px 5px 6px 0}.muted{color:#a8c4dc;font-size:12px}.colors{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:48px;height:48px;border-radius:50%;border:2px solid #fff8;cursor:pointer}.swatch.sel{outline:3px solid #ffe5a0;outline-offset:3px}.palette{display:flex;gap:8px;margin-top:14px}.palette span{height:44px;flex:1;border-radius:8px;border:1px solid #ffffff66}.memory{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.memory img{width:100%;border-radius:12px}.letter{background:#f4e8c9;color:#334155;padding:25px;border-radius:5px;min-height:180px;box-shadow:0 10px 30px #0008}.envelope{background:#c5a66b;color:#17283b;border:0;padding:28px 35px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);font-size:24px}.puzzle{display:grid;gap:3px;max-width:340px;aspect-ratio:1;margin:12px auto}.puzzle button{margin:0;border:1px solid #d4efff66;background-size:300% 300%;min-width:0;min-height:0}.tile{cursor:grab}.cake{font-size:90px;text-align:center;filter:drop-shadow(0 0 15px #ffe5a0)}.hidden{display:none!important}canvas{max-width:100%;border-radius:12px;background:#06152b}.admin{position:fixed;bottom:12px;right:12px;z-index:4;opacity:.5;font-size:11px}.adminbox{position:fixed;inset:0;background:#020916eF;z-index:9;display:none;overflow:auto;padding:20px}.adminbox.show{display:block}.admininner{max-width:760px;margin:20px auto;background:#0b2440;padding:22px;border-radius:18px}.admininner label{display:block;margin-top:12px;color:#c5e4ff}.admininner input,.admininner textarea{width:100%}.adminrow{border-bottom:1px solid #ffffff22;padding:12px 0}.notice{padding:12px;border:1px solid #ffe5a077;border-radius:10px;color:#ffe5a0;font-size:12px}
</style></head><body><div class="moon"></div><main class="wrap"><header class="top"><div class="eyebrow">✦ A LITTLE UNIVERSE MADE FOR YOU ✦</div><h1>给你的星空</h1><p>在宇宙的这一晚，收集属于你的 19 岁</p></header><section class="orbit"><div class="center"><img src="assets/growth-voxel.png" alt="成长星辰像素纪念图"><b>SCORPIO · 19</b><small class="muted">点亮每一颗星星</small></div><div class="stars" id="stars"></div></section><div style="text-align:center;margin-top:24px"><button class="btn" id="musicBtn">♫ 开启今晚的音乐</button><audio id="bgm" loop></audio><p class="muted">建议戴上耳机，慢慢探索这片星空</p></div><div class="footer">✦ 你是宇宙赠予今晚最亮的星 ✦</div></main>
<div class="panel" id="panel"><div class="dialog"><button class="close" id="close">×</button><div id="panelBody"></div></div></div><button class="admin" id="adminOpen">编辑入口</button><div class="adminbox" id="adminBox"><div class="admininner"><button class="close" id="adminClose">×</button><h2>星空管理员 · 内容准备</h2><p class="muted">仅用于你自己的设备准备内容。完成后导出配置文件；将配置和媒体资源一并发布，访客才能看到。静态网页没有真正的账号权限系统。</p><div class="notice">重要：浏览器里的编辑入口不是安全认证。不要在这里填写隐私密码。发布到公开网址前，请移除编辑入口或保留为本地编辑副本。</div><label>首页标题<input id="cfgTitle" class="field"></label><label>副标题<input id="cfgSub" class="field"></label><label>背景音乐<input id="cfgMusic" type="file" accept="audio/*" class="field"></label><div id="adminStars"></div><button class="btn" id="exportCfg">导出内容配置 JSON</button><label>导入配置<input id="importCfg" type="file" accept="application/json" class="field"></label><button class="btn" id="saveCfg">保存到本机预览</button></div></div>
<script>
const names=['今晚的音乐','此刻的三个词','今晚的调色盘','成长星辰','回忆拼图','隐藏的19','我们的回忆','分享天空','最初认识的模样','一封信','生日蛋糕'];const icons=['♫','✧','◉','▣','▧','＋','♡','☁','▤','✉','✦'];let cfg={title:'给你的星空',sub:'在宇宙的这一晚，收集属于你的 19 岁',stars:names.map((n,i)=>({title:n,text:['把喜欢的音乐放进今晚，让星星陪你听。','写下三个词，留住此刻的心情。','选出今晚最喜欢的三个颜色。','时间悄悄流逝，而你正在变成更好的自己。','把回忆拼完整，看看藏在照片里的那一天。','经过几道小小的计算，找到藏起来的数字。','每一张照片，都有一段只属于我们的故事。','把两片天空放在一起，今晚就有了共同的风景。','这是我们最初认识时的模样。','有一封信，想在今晚亲手交给你。','等生日歌完整响起，再点亮蜡烛许愿。'][i],image:'',extra:''}))};let selectedColors=[], puzzleState=[];
const $=s=>document.querySelector(s);function save(){localStorage.setItem('scorpioCfg',JSON.stringify(cfg))}function load(){try{let x=JSON.parse(localStorage.getItem('scorpioCfg'));if(x)cfg=x}catch(e){}}load();$('#stars').innerHTML=names.map((n,i)=>`<button class="star" data-i="${i}"><span class="ico">${icons[i]}</span><small>${String(i+1).padStart(2,'0')} · ${n}</small></button>`).join('');document.querySelectorAll('.star').forEach(b=>b.onclick=()=>openStar(+b.dataset.i));function open(html){$('#panelBody').innerHTML=html;$('#panel').classList.add('show')}$('#close').onclick=()=>$('#panel').classList.remove('show');$('#panel').onclick=e=>{if(e.target.id==='panel')$('#panel').classList.remove('show')};function openStar(i){let s=cfg.stars[i],base=`<div class="eyebrow">STAR ${String(i+1).padStart(2,'0')} / 11</div><h2>${s.title||names[i]}</h2><div class="sub">${s.text||''}</div>`;let body='';switch(i){case 0:body=`<p>把今晚的音乐打开，慢慢听。</p><input id="localAudio" type="file" accept="audio/*" class="field"><audio id="localPlayer" controls style="width:100%"></audio>`;break;case 1:body=`<p>用三个词描述此刻的自己。</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><input class="field mood" maxlength="8" placeholder="第一个词"><input class="field mood" maxlength="8" placeholder="第二个词"><input class="field mood" maxlength="8" placeholder="第三个词"></div><button class="btn" id="moodSend">写下此刻</button><p id="moodResult"></p>`;break;case 2:let cols=['#8bbce8','#d6e8f8','#f4d68b','#9fc5b0','#e9a9a0','#ffffff','#526f99','#b8c8d8','#d5b98c'];body=`<p>从星云里选出三个颜色，编织今晚的调色盘。</p><div class="colors">${cols.map(c=>`<button class="swatch" data-c="${c}" style="background:${c}"></button>`).join('')}</div><div class="palette" id="palette"></div><p id="colorMsg" class="muted">已选择 0 / 3</p>`;break;case 3:body=`<img src="assets/growth-voxel.png" style="width:100%;border-radius:14px"><p>从小小的你，到今天闪闪发光的你。每一步成长，都值得被庆祝。</p><h2 style="text-align:center;color:#ffe5a0">LEVEL UP!<br>你成为了1岁的大人</h2>`;break;case 4:body=`<p>把照片拼回完整的样子吧。选择难度：</p><select id="puzzleSize" class="field"><option value="3">3 × 3（简单）</option><option value="4">4 × 4（普通）</option><option value="5">5 × 5（挑战）</option></select><input id="puzzlePhoto" type="file" accept="image/*" class="field"><button class="btn" id="makePuzzle">开始拼图</button><div id="puzzleArea"></div><p id="puzzleMsg"></p>`;break;case 5:body=`<p>解开这几道小小的算式，最后会找到一个特别的数字。</p><div id="mathQ"></div><button class="btn" id="checkMath">提交答案</button><p id="mathMsg"></p>`;break;case 6:body=`<p>沿着照片，再走一遍那些闪闪发光的日子。</p><input id="galleryUpload" type="file" accept="image/*" multiple class="field"><div id="gallery" class="memory"></div><textarea id="feeling" placeholder="写下此刻的感受…"></textarea><button class="btn" id="sendFeeling">留下感受</button><p id="feelingMsg"></p>`;break;case 7:body=`<p>你上传一片天空，也邀请你把此刻的天空分享给我。</p><label>我的天空<input id="skyA" type="file" accept="image/*" class="field"></label><label>你的天空<input id="skyB" type="file" accept="image/*" class="field"></label><button class="btn" id="blendSky">融合两片天空</button><div id="skyOut" class="memory"></div>`;break;case 8:body=`<p>最初认识的模样，被好好收藏在这里。</p><input id="chatUpload" type="file" accept="image/*" class="field"><div id="chatShot"></div>`;break;case 9:body=`<div style="text-align:center"><button class="envelope" id="openLetter">✉<br>点击拆开这封信</button></div><div id="letterBody" class="hidden letter" style="margin-top:15px;white-space:pre-wrap">亲爱的：\n\n愿你在新的一岁，仍然相信星星，相信热爱，也相信自己值得所有美好。\n\n生日快乐。\n\n—— 一位想把星空送给你的人</div>`;break;case 10:body=`<p>每点击一次，生日歌就向前走一小段。让我们一起把歌声接完整。</p><div class="cake">🎂</div><div style="text-align:center"><button class="btn" id="songTap">点一下，唱一段生日快乐</button><p id="songCount">已点亮 0 / 4 段</p><div id="wishArea" class="hidden"><p>歌声完整了。现在，闭上眼睛许个愿吧。</p><button class="btn" id="candle">点亮蜡烛 🕯️</button><textarea id="wishText" placeholder="把愿望留给星星（也可以不写）"></textarea><button class="btn" id="wishSend">完成许愿</button><p id="wishMsg"></p></div></div>`;break;}open(base+`<div class="content">${body}</div>`);wire(i)}
function wire(i){if(i===0){$('#localAudio').onchange=e=>{let f=e.target.files[0];if(f)$('#localPlayer').src=URL.createObjectURL(f)}}if(i===1)$('#moodSend').onclick=()=>{let a=[...document.querySelectorAll('.mood')].map(x=>x.value.trim());if(a.some(x=>!x))return $('#moodResult').textContent='请写满三个词。';$('#moodResult').textContent=a.includes('幸福')?'✨ 星星听见了幸福，隐藏的流星为你亮起！':'这三个词已经被星空收藏。愿你今晚被温柔包围。';if(a.includes('幸福'))fireworks()};if(i===2){document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{let c=b.dataset.c;if(selectedColors.includes(c))selectedColors=selectedColors.filter(x=>x!==c);else if(selectedColors.length<3)selectedColors.push(c);b.classList.toggle('sel',selectedColors.includes(c));$('#palette').innerHTML=selectedColors.map(x=>`<span style="background:${x}"></span>`).join('');$('#colorMsg').textContent=`已选择 ${selectedColors.length} / 3`})}if(i===4){let photo='';$('#puzzlePhoto').onchange=e=>{let f=e.target.files[0];if(f)photo=URL.createObjectURL(f)};$('#makePuzzle').onclick=()=>{if(!photo)return $('#puzzleMsg').textContent='先选择一张照片。';let n=+$('#puzzleSize').value,area=$('#puzzleArea');puzzleState=Array.from({length:n*n},(_,k)=>k);for(let k=puzzleState.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[puzzleState[k],puzzleState[j]]=[puzzleState[j],puzzleState[k]]}area.innerHTML=`<div class="puzzle" style="grid-template-columns:repeat(${n},1fr)">${puzzleState.map((v,k)=>`<button class="tile" data-k="${k}" style="background-image:url('${photo}');background-size:${n*100}% ${n*100}%;background-position:${v%n/(n-1)*100}% ${Math.floor(v/n)/(n-1)*100}%"></button>`).join('')}</div>`;let first=null;const draw=()=>{area.innerHTML=`<div class="puzzle" style="grid-template-columns:repeat(${n},1fr)">${puzzleState.map((v,k)=>`<button class="tile" data-k="${k}" style="background-image:url('${photo}');background-size:${n*100}% ${n*100}%;background-position:${(v%n)/(n-1)*100}% ${Math.floor(v/n)/(n-1)*100}%"></button>`).join('')}</div>`;area.querySelectorAll('button').forEach(b=>b.onclick=()=>{let k=+b.dataset.k;if(first===null){first=k;b.style.outline='3px solid #ffe5a0'}else{[puzzleState[first],puzzleState[k]]=[puzzleState[k],puzzleState[first]];first=null;if(puzzleState.every((v,j)=>v===j)){$('#puzzleMsg').textContent='拼图完成！你把这段回忆重新拼好了。';}draw();}})};draw()}}if(i===5){let q=[['(8 + 7) × 2',30],['30 − 6 × 2',18],['18 + 12 ÷ 4',21],['21 − 8 + 6 − 0',19]];$('#mathQ').innerHTML=q.map((x,j)=>`<p>${j+1}. ${x[0]} = <input class="field answer" style="width:90px;display:inline-block" inputmode="numeric"></p>`).join('');$('#checkMath').onclick=()=>{let a=[...document.querySelectorAll('.answer')].map(x=>+x.value);$('#mathMsg').textContent=a.every((x,j)=>x===q[j][1])?'答对了！祝你19岁生日快乐！':'再检查一下每一步，答案就在最后。'}}if(i===6){let files=[];$('#galleryUpload').onchange=e=>{files=[...e.target.files].map(f=>URL.createObjectURL(f));$('#gallery').innerHTML=files.map(f=>`<img src="${f}">`).join('')}}if(i===7){let a,b;$('#skyA').onchange=e=>a=e.target.files[0]?URL.createObjectURL(e.target.files[0]):null;$('#skyB').onchange=e=>b=e.target.files[0]?URL.createObjectURL(e.target.files[0]):null;$('#blendSky').onclick=()=>{if(!a||!b)return $('#skyOut').textContent='请先上传两张天空照片。';$('#skyOut').innerHTML=`<img src="${a}" style="width:49%"><img src="${b}" style="width:49%">`}}if(i===8)$('#chatUpload').onchange=e=>{let f=e.target.files[0];if(f)$('#chatShot').innerHTML=`<img src="${URL.createObjectURL(f)}" style="width:100%;border-radius:12px">`};if(i===9)$('#openLetter').onclick=()=>{$('#letterBody').classList.remove('hidden');$('#openLetter').textContent='信封已打开 ✦'};if(i===10){let count=0;$('#songTap').onclick=()=>{count++;$('#songCount').textContent=`已点亮 ${Math.min(count,4)} / 4 段`;fireworks();if(count>=4){$('#wishArea').classList.remove('hidden');$('#songTap').disabled=true;$('#songTap').textContent='生日歌已唱完'}};$('#candle').onclick=()=>{$('.cake').textContent='🎂🕯️';fireworks()};$('#wishSend').onclick=()=>$('#wishMsg').textContent='愿望已经交给星星保管。生日快乐！'}}}
function fireworks(){let c=document.createElement('div');c.textContent='✦  ✧  ✨  ✦  ✧';c.style='position:fixed;inset:20% 0 auto;text-align:center;font-size:34px;pointer-events:none;z-index:10;text-shadow:0 0 20px #fff';document.body.append(c);setTimeout(()=>c.remove(),1300)}$('#musicBtn').onclick=()=>{let a=$('#bgm');if(a.src){a.paused?a.play():a.pause();$('#musicBtn').textContent=a.paused?'♫ 开启今晚的音乐':'Ⅱ 暂停音乐'}else{$('#musicBtn').textContent='请在编辑入口添加音乐';$('#adminBox').classList.add('show')}};
$('#adminOpen').onclick=()=>{$('#adminBox').classList.add('show');$('#cfgTitle').value=cfg.title;$('#cfgSub').value=cfg.sub;$('#adminStars').innerHTML=cfg.stars.map((s,i)=>`<div class="adminrow"><b>${i+1}. ${names[i]}</b><label>标题<input class="field atitle" data-i="${i}" value="${esc(s.title)}"></label><label>说明<textarea class="field atext" data-i="${i}">${esc(s.text)}</textarea></label><label>配图<input class="field aimg" data-i="${i}" type="file" accept="image/*"></label></div>`).join('')};$('#adminClose').onclick=()=>$('#adminBox').classList.remove('show');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function updateCfg(){cfg.title=$('#cfgTitle').value;cfg.sub=$('#cfgSub').value;document.querySelector('.top h1').textContent=cfg.title;document.querySelector('.top p').textContent=cfg.sub;document.querySelectorAll('.atitle').forEach(x=>cfg.stars[+x.dataset.i].title=x.value);document.querySelectorAll('.atext').forEach(x=>cfg.stars[+x.dataset.i].text=x.value);save()}$('#saveCfg').onclick=()=>{updateCfg();alert('已保存到本机浏览器。')};$('#exportCfg').onclick=()=>{updateCfg();let blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='starry-birthday-content.json';a.click()};$('#importCfg').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{cfg=JSON.parse(r.result);save();location.reload()}catch(err){alert('配置文件格式不正确')}};r.readAsText(f)};$('#cfgMusic').onchange=e=>{let f=e.target.files[0];if(f){$('#bgm').src=URL.createObjectURL(f);$('#musicBtn').textContent='♫ 播放已选择的音乐'}};
</script></body></html>
