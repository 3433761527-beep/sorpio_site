name: Verify birthday website
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_BASE_PATH: /sorpio_site/
          VITE_SUPABASE_URL: https://ejyhkfzzbsbtzgjtexpf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_synJ5s08RTpbL4EinwXmMw_rYhJVoBA
